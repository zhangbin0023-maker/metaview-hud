# GitHub Actions: Build TurboMeta Agent HUD for iOS
# 全程在 GitHub 的云端 macOS runner 上编译，你只需要在 Windows 上 git push
#
# 前提条件（一次性配置）：
# 1. Apple Developer 账号 ($99/年) — https://developer.apple.com
# 2. 在 GitHub Repo Settings → Secrets 中添加以下 Secrets：
#    - APP_STORE_P12_BASE64    — 导出的签名证书 .p12 的 base64
#    - APP_STORE_P12_PASSWORD  — .p12 密码
#    - APP_STORE_PROVISIONING_PROFILE_BASE64 — .mobileprovision 的 base64
# 3. 或者用免费 Apple ID（7天签名，不上架）— 只需 APPLE_ID + APPLE_PASSWORD

name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - appstore

jobs:
  build-ios:
    runs-on: macos-15  # GitHub 免费提供 macOS runner
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Add iOS platform
        run: |
          npx cap sync ios
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Configure signing (Development)
        if: github.event.inputs.build_type == 'development'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Create temporary keychain
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 build.keychain

          # Download certificate using fastlane
          gem install fastlane
          fastlane sigh --app_identifier com.turbometa.agent \
            --username "$APPLE_ID" \
            --adhoc \
            --platform ios

      - name: Build IPA
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGN_STYLE=Automatic
            
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/output \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TurboMeta-Agent-iOS
          path: ios/App/build/output/*.ipa
          retention-days: 30
